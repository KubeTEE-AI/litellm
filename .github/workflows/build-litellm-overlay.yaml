name: Build and Publish LiteLLM Gateway Overlay

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (optional; default = <base_tag>-kubetee.<auto-increment>)"
        required: false
        type: string
      base_tag:
        description: "Upstream litellm-database tag override (optional; default = env.DEFAULT_BASE_TAG)"
        required: false
        type: string
  push:
    branches:
      - kubetee-prod
      # Feature-only review evidence. Publishing remains restricted to the
      # protected production branch; PR merge runs use the base workflow.
      # This lets the source's own offline test revisions be exercised.
      - gamma-mtls-release
    paths:
      - "tools/kubetee-litellm-overlay/**"
      - "tests/test_litellm/tools/kubetee-litellm-overlay/**"
      - ".github/workflows/build-litellm-overlay.yaml"

  pull_request:
    branches:
      - kubetee-prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kubetee-ai/litellm-database
  # 1.103.9-kubetee.3 (2026-10-28): adds kubetee_mcp_trust.py — the
  # outbound MCP client gets its own measured trust context instead of
  # inheriting the process-global ssl_verify (the east-west CA only). Public
  # MCP servers (DeepWiki, HF) failed TLS ("unable to get local issuer
  # certificate") and the fix must NOT widen the east-west lane: default
  # KUBETEE_MCP_VERIFY=certifi (measured web PKI, in-image) — lanes disjoint;
  # east-west stays measured-only. The anchor+certifi composite is an explicit
  # opt-in ("eastwest") for deployments with private MCP upstreams. Also keeps
  # the east-west CLIENT cert off the MCP lane (sitecustomize keys its attach
  # on the east-west CA path only).
  # 1.103.3-kubetee.8 (2026-10-07): route guard also 404s video STATUS/
  # CONTENT polls whose video_id cannot resolve to a router deployment
  # (raw/unresolvable ids). Hit via Belarel 2026-10-06: 148x 500
  # "Cannot connect to api.openai.com:443 [SSLCertVerificationError]" —
  # unresolvable id -> provider defaults to "openai" -> direct
  # litellm.avideo_status dials api.openai.com -> TLS verify fails (TDX pod
  # trusts only the east-west CA). 404 video_not_found avoids the outbound
  # call entirely; gateway-issued ids still poll normally.
  # 1.103.3-kubetee.7 (2026-10-06): GLM-5.2 low/medium/minimal now MAP to
  # high instead of 400 — a live client sent effort=low on z-ai/glm-5.2 and
  # was rejected ("reasoning_effort='low' is not supported"). The 5.2
  # template accepts high/max only and coerces everything else to max, so
  # "high" is the only faithful downgrade path for clients asking for less
  # thinking; "none" keeps the native enable_thinking=False toggle.
  # 1.103.3-kubetee.6 (2026-10-06): kubetee_glm_effort posture revised
  # after checking the zai-org model cards — the GLM-5.3 card documents
  # any-other-value -> max ("defaults to max if not passed (or if set to
  # any other value)"), so medium/minimal/unknown on the glm-5.3 family now
  # MAP to max instead of 400 (SDKs defaulting to medium were being
  # rejected within the hour of kubetee.5 shipping). "none" stays a hard
  # 400 (the one value a client expects to suppress thinking). glm-5.2
  # unchanged: high/max/none only, no invented mappings.
  # 1.103.3-kubetee.5 (2026-10-06): adds kubetee_glm_effort.py —
  # validates/maps reasoning_effort for GLM models (Belarel audit item 10):
  # glm-5.3 family rejects none with 400 (always-on reasoners; the template
  # coerces them to max, and v0.5.20 degenerate-loops on "none");
  # glm-5.2 honors "none" via the native enable_thinking toggle;
  # low/high/max pass through (verified live at temperature 0).
  # 1.103.3-kubetee.4 (2026-10-06): kubetee_pricing adds the MiniMax-H3
  # video entry (output_cost_per_video_per_second 0.08) — video spend was $0
  # on the litellm_params-only row shape (a1a6a889): get_litellm_params()
  # drops the key, use_custom_pricing_for_model never opens, and the
  # get_model_info() fallback raised ModelNotMappedError (proxy swallows
  # cost exceptions -> $0). Static entry makes both row shapes bill
  # 0.08/s * duration.
  # 1.103.3-kubetee.3 (2026-10-05): adds kubetee_pricing.py — static
  # cost-map entries (litellm.register_model, persist_across_reloads) so
  # image-generation spend tracks $0.05/image under the honest FLUX.2-klein
  # model name on 1.103.x (deployment input_cost_per_image is ignored for
  # images pre-#39311/1.104.0). DB row c4eb8424 migrated off the dall-e-2
  # masquerade the same day; drop this module one release after the base
  # moves to >= 1.104.
  # 1.103.3-kubetee.2 (2026-10-05): route guard async_pre_call_hook fixed to
  # `async def` — kubetee.1 shipped a SYNC def; the proxy dispatch does
  # `await callback.async_pre_call_hook(...)` -> None -> TypeError on EVERY
  # request (gateway 500s). CI now asserts coroutine-function hooks.
  # Base 1.103.3 (ecae261b10) = 1.103.2 + migration-check hardening, wolfi
  # glibc bump, pyjwt/pypdf/tornado/urllib3/gitpython advisory bumps,
  # streamed-chunk pricing fix. Overlay contents: kubetee_route_guard.py
  # (block GET /v1/videos list — global store, no per-key scoping),
  # kubetee_attestation.py (client-facing TDX attestation), sitecustomize.py
  # (east-west client cert loading).
  DEFAULT_BASE_TAG: 1.108.3
  # v1.108.3 multi-architecture index verified with BerriAI's cosign key.
  DEFAULT_BASE_DIGEST: sha256:aecfcc459b5af208f04b8e916c9912cc3001798e013b4874be1831c20e4a2c26

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    env:
      PR_NUMBER: ${{ github.event.number }}
      # Only pushes to protected kubetee-prod may publish. The isolated
      # gamma-mtls-release push is purely read-only review validation.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/kubetee-prod' }}
    steps:
      - name: Clean root-owned leftovers from prior runs
        run: |
          sudo rm -rf tools/kubetee-litellm-overlay/__pycache__ || true
          sudo chown -R $(id -u):$(id -g) . 2>/dev/null || true

      - name: Checkout litellm fork
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Require production source branch for publishing
        run: |
          if [ "$PUBLISH" = "true" ]; then
            test "${GITHUB_REF_NAME}" = "kubetee-prod"
          else
            # Scope test-only events; never publish feature review artifacts.
            test "${GITHUB_EVENT_NAME}" = "push" || test "${GITHUB_EVENT_NAME}" = "pull_request"
          fi

      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BASE_TAG: ${{ inputs.base_tag }}
        run: |
          BASE_TAG="$INPUT_BASE_TAG"
          [ -z "$BASE_TAG" ] && BASE_TAG="${DEFAULT_BASE_TAG}"
      
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$PUBLISH" != "true" ]; then
            TAG="pr-${PR_NUMBER}-validation"
          fi
          if [ -z "$TAG" ]; then
            MAX_N=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/orgs/KubeTEE-AI/packages/container/${IMAGE_NAME#*/}/versions?per_page=100" \
              | grep -oE "\"${BASE_TAG}-kubetee\.[0-9]+\"" \
              | sed -E 's/.*-kubetee\.([0-9]+)"/\1/' \
              | sort -n | tail -1)
            TAG="${BASE_TAG}-kubetee.$((${MAX_N:-0} + 1))"
          fi
      
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BASE_TAG=$BASE_TAG" >> "$GITHUB_ENV"
          echo "Resolved TAG=${TAG} BASE_TAG=${BASE_TAG}"

      - name: Install uv for isolated test tools
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Prepare actual external signer contract test
        run: |
          # btcli is a test-only tool, not a runtime dependency of LiteLLM.
          # Its uv-installed shebang points at this checkout; invoke its real
          # console package with the base interpreter instead of editing wheels.
          uv pip install --target /tmp/gamma-cli \
            --python-platform linux --python-version 3.13 'bittensor[cli]==11.3.2'
          mkdir /tmp/gamma-test-bin
          printf '#!/bin/sh\nexec /app/.venv/bin/python /tmp/gamma-cli/bin/btcli "$@"\n' \
            > /tmp/gamma-test-bin/btcli
          chmod 700 /tmp/gamma-test-bin/btcli
          # Synthetic claim compatibility tests need no network chain endpoint.
          SUBNET_WORKTREE=$(dirname "$(dirname "$GITHUB_WORKSPACE")")/kubetee-subnet
          if test -d "$SUBNET_WORKTREE/gamma_funder"; then
            echo "gamma_worker_source=$SUBNET_WORKTREE/gamma_funder" >> "$GITHUB_ENV"
          else
            git clone --depth 1 --branch feat/gamma-funder-release \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY_OWNER/kubetee-subnet.git" \
              /tmp/gamma-worker
            echo "gamma_worker_source=/tmp/gamma-worker/gamma_funder" >> "$GITHUB_ENV"
          fi

      - name: Run overlay tests against supported LiteLLM base
        run: |
          # The omitted pytest-asyncio plugin makes the 13 async Gamma
          # tests fail-as-unsupported even though the synchronous suite is green.
          # Pin the complete six-wheel test closure to hashes from uv.lock; do
          # not rely on the base image's missing/ incompatible seller packet.
          # Pin both project-pinned wheels and required pytest runtime deps.
          # No transitive resolution is allowed at install time.
          # a floating version from a generic runner image. Install only after
          # the two downloaded wheel digests match, then stage the packet.
          mkdir -p /tmp/litellm-overlay-test-packet
          curl --proto '=https' -fsSL --output \
            /tmp/litellm-overlay-test-packet/pytest-9.0.3-py3-none-any.whl \
            https://files.pythonhosted.org/packages/d4/24/a372aaf5c9b7208e7112038812994107bc65a84cd00e0354a88c2c77a617/pytest-9.0.3-py3-none-any.whl
          curl --proto '=https' -fsSL --output \
            /tmp/litellm-overlay-test-packet/pytest_asyncio-1.3.0-py3-none-any.whl \
            https://files.pythonhosted.org/packages/e5/35/f8b19922b6a25bc0880171a2f1a003eaeb93657475193ab516fd87cac9da/pytest_asyncio-1.3.0-py3-none-any.whl
          curl --proto '=https' -fsSL --output \
            /tmp/litellm-overlay-test-packet/pluggy-1.6.0-py3-none-any.whl \
            https://files.pythonhosted.org/packages/54/20/4d324d65cc6d9205fabedc306948156824eb9f0ee1633355a8f7ec5c66bf/pluggy-1.6.0-py3-none-any.whl
          curl --proto '=https' -fsSL --output \
            /tmp/litellm-overlay-test-packet/iniconfig-2.3.0-py3-none-any.whl \
            https://files.pythonhosted.org/packages/cb/b1/3846dd7f199d53cb17f49cba7e651e9ce294d8497c8c150530ed11865bb8/iniconfig-2.3.0-py3-none-any.whl
          curl --proto '=https' -fsSL --output \
            /tmp/litellm-overlay-test-packet/packaging-26.2-py3-none-any.whl \
            https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
          curl --proto '=https' -fsSL --output \
            /tmp/litellm-overlay-test-packet/pygments-2.20.0-py3-none-any.whl \
            https://files.pythonhosted.org/packages/f4/7e/a72dd26f3b0f4f2bf1dd8923c85f7ceb43172af56d63c7383eb62b332364/pygments-2.20.0-py3-none-any.whl
          printf '%s  %s\n' \
            2c5efc453d45394fdd706ade797c0a81091eccd1d6e4bccfcd476e2b8e0ab5d9 pytest-9.0.3-py3-none-any.whl \
            611e26147c7f77640e6d0a92a38ed17c3e9848063698d5c93d5aa7aa11cebff5 pytest_asyncio-1.3.0-py3-none-any.whl \
            e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746 pluggy-1.6.0-py3-none-any.whl \
            f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12 iniconfig-2.3.0-py3-none-any.whl \
            5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e packaging-26.2-py3-none-any.whl \
            81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176 pygments-2.20.0-py3-none-any.whl \
            | (cd /tmp/litellm-overlay-test-packet && shasum -a 256 --check --status -)
          # Unpack verified wheels byte-for-byte. A host uv resolver may infer
          # metadata from the working project even with --no-deps --offline.
          # This is not dependency resolution and cannot select a new version.
          for wheel in /tmp/litellm-overlay-test-packet/*.whl; do
            python3 -m zipfile -e "$wheel" /tmp/litellm-overlay-test-deps/
          done
          test -d /tmp/litellm-overlay-test-deps/pytest_asyncio
          python3 -c 'import sys; sys.path.insert(0,"/tmp/litellm-overlay-test-deps"); import pytest,pytest_asyncio; assert pytest.__version__ == "9.0.3"; assert pytest_asyncio.__version__ == "1.3.0"'
          # Keep wheel metadata: pytest discovers its own supported plugins
          # through dist-info entry points, including the asyncio event loop.
          # Do not also pass -p: it registers that same plugin a second time.
          docker run --rm -v /tmp/litellm-overlay-test-deps:/tmp/test-deps:ro \
            --entrypoint /app/.venv/bin/python \
            ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST} \
            -c 'import sys; sys.path.insert(0,"/tmp/test-deps"); import pytest,pytest_asyncio; assert pytest.__version__=="9.0.3"; assert pytest_asyncio.__version__=="1.3.0"; print("supported-runtime packet import validation passed")'
          rm -rf /tmp/litellm-overlay-test-packet
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/tmp/test-deps:/tmp/gamma-cli:${{ env.gamma_worker_source }} \
            -e PATH=/tmp/gamma-test-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e KUBETEE_GAMMA_WORKER_ROOT=${{ env.gamma_worker_source }} \
            -v /tmp/gamma-cli:/tmp/gamma-cli:ro \
            -v /tmp/gamma-test-bin:/tmp/gamma-test-bin:ro \
            -v "${{ env.gamma_worker_source }}:${{ env.gamma_worker_source }}:ro" \
            -v /tmp/litellm-overlay-test-deps:/tmp/test-deps:ro \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            --entrypoint /app/.venv/bin/python \
            ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST} \
            -m pytest -q tests/test_litellm/tools/kubetee-litellm-overlay

      - name: Verify upstream base with its published Cosign key
        run: |
          curl -fsSL --proto '=https' \
            https://raw.githubusercontent.com/BerriAI/litellm/e82a3c646908ba0a6ee0beddc4310d7a6cac4065/cosign.pub \
            -o /tmp/berriai-litellm-cosign.pub
          cosign verify --key /tmp/berriai-litellm-cosign.pub \
            ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST}

      - name: Verify native aiohttp transport compatibility
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python \
            ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST} -c "
          from litellm.llms.custom_httpx import http_handler
          from unittest.mock import patch
          with (patch.object(http_handler, 'AIOHTTP_SO_KEEPALIVE', True),
                patch.object(http_handler, '_AIOHTTP_SUPPORTS_SOCKET_FACTORY', True)):
              assert http_handler.build_aiohttp_keepalive_socket_factory() is not None
          with patch.object(http_handler, '_AIOHTTP_SUPPORTS_SOCKET_FACTORY', False):
              assert http_handler.build_aiohttp_keepalive_socket_factory() is None
          print('native socket factory and fallback verified')
          "

      - name: Login to ghcr (authenticated pulls — anonymous is IP-rate-limited)
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u KubeTEE-AI --password-stdin

      - name: Verify overlay modules are present and non-trivial
        run: |
          cd tools/kubetee-litellm-overlay
          for f in kubetee_route_guard.py kubetee_attestation.py kubetee_binding.py kubetee_ear.py kubetee_eastwest.py kubetee_bootstrap.py kubetee-entrypoint.sh sitecustomize.py kubetee_glm_effort.py kubetee_mcp_trust.py kubetee_health_latest.py kubetee_gamma_claim.py kubetee_gamma_management.py kubetee_gamma_private_mtls.py kubetee_gamma_scope.py kubetee_gamma_transport.py Dockerfile; do
            test -s "$f" || { echo "MISSING $f"; exit 1; }
          done
          test ! -e kubetee_pricing.py
          grep -q 'COPY.*kubetee_health_latest' Dockerfile
          test "$BASE_TAG" = "1.108.3" || { echo 'BASE_TAG override changes this release candidate'; exit 1; }
          test "$DEFAULT_BASE_DIGEST" = "sha256:aecfcc459b5af208f04b8e916c9912cc3001798e013b4874be1831c20e4a2c26"
          # Route guard must block the video list call type.
          grep -q 'avideo_list' kubetee_route_guard.py
          grep -q 'KubeTEERouteGuard' kubetee_route_guard.py
          grep -q 'HTTP_404_NOT_FOUND' kubetee_route_guard.py
          # GLM effort module must validate + map, and its hook must be async.
          grep -q 'KubeTEEGlmEffort' kubetee_glm_effort.py
          grep -q 'reasoning_effort_not_supported' kubetee_glm_effort.py
          grep -q 'enable_thinking' kubetee_glm_effort.py
          # MCP trust module must carry the split-trust construction and the
          # single patch seam (MCPClient.__init__ — the factory reads its
          # ssl_verify). Anything less reproduces the public-MCP TLS failure
          # or, worse, widens the east-west lane.
          grep -q 'KubeTEEMCPTrust' kubetee_mcp_trust.py
          grep -q 'build_mcp_trust_context' kubetee_mcp_trust.py
          grep -q 'certifi.where' kubetee_mcp_trust.py
          # Health-latest patch must replace both SQL constants name-first.
          grep -q 'LATEST_HEALTH_CHECKS_SQL' kubetee_health_latest.py
          grep -q 'DISTINCT ON (\"model_name\")' kubetee_health_latest.py
          # Health-latest logger must subclass CustomLogger (callback loader rejects plain objects).
          grep -q 'CustomLogger' kubetee_health_latest.py
          grep -q 'class KubeTEEHealthLatest(CustomLogger)' kubetee_health_latest.py
          # The dispatch path does `await callback.async_pre_call_hook(...)` —
          # a SYNC def returns None and every request 500s (kubetee.1 incident
          # 2026-10-05). Both hooks MUST be coroutine functions.
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/overlay" \
            --entrypoint /app/.venv/bin/python \
            ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST} \
            -c "
          import sys, inspect
          sys.path.insert(0, '/overlay')
          from kubetee_route_guard import KubeTEERouteGuard
          from kubetee_attestation import KubeTEEAttestationLogger
          from kubetee_glm_effort import KubeTEEGlmEffort
          assert inspect.iscoroutinefunction(KubeTEERouteGuard.async_pre_call_hook), \
              'async_pre_call_hook must be async def (awaited by proxy dispatch)'
          assert inspect.iscoroutinefunction(KubeTEEGlmEffort.async_pre_call_hook), \
              'glm effort async_pre_call_hook must be async def'
          assert inspect.iscoroutinefunction(KubeTEEAttestationLogger.async_post_call_response_headers_hook), \
              'async_post_call_response_headers_hook must be async def'
          print('hook coroutine-function check OK')
          "
          # Attestation module must mount /v1/attestation via CustomLogger.
          grep -q 'KubeTEEAttestationLogger' kubetee_attestation.py
          grep -q '/v1/attestation' kubetee_attestation.py
          # Binding module must carry the v1 construction + its pinned purpose tag.
          grep -q 'kubetee.attestation.v1' kubetee_binding.py
          grep -q 'report_data_statement' kubetee_binding.py
          grep -q 'zero-padded' kubetee_binding.py
          # EAR module must carry BOTH tee-pubkey arms (the RSA east-west key
          # is the live identity; an EC-only helper raised AttributeError and
          # left `appraisal` permanently absent — 2026-10-27) and the mint must
          # actually be wired into the startup fetch (it had no caller at all).
          grep -q 'TeePubKey::RSA' kubetee_ear.py
          grep -q 'tee_pubkey_from_key_pem' kubetee_ear.py
          grep -q 'bootstrap_ear' kubetee_eastwest.py
          grep -q 'kubetee_ear' kubetee_eastwest.py
          echo "overlay modules verified"
          sha256sum kubetee_route_guard.py kubetee_attestation.py kubetee_binding.py sitecustomize.py

      - name: Smoke test modules against the base image
        run: |
          cd tools/kubetee-litellm-overlay
          docker pull ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST}
          docker run --rm \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/overlay" \
            --entrypoint /app/.venv/bin/python \
            ghcr.io/berriai/litellm-database@${DEFAULT_BASE_DIGEST} \
            -c "
          import sys
          sys.path.insert(0, '/overlay')
          import kubetee_route_guard
          import kubetee_attestation
          import kubetee_binding
          import kubetee_ear
          import kubetee_eastwest
          import kubetee_bootstrap
          import sitecustomize  # noqa - runs import-time ssl patch
          import importlib.util
          import kubetee_glm_effort  # noqa - request-path validation
          import kubetee_health_latest
          assert importlib.util.find_spec('kubetee_pricing') is None
          from litellm.integrations.custom_logger import CustomLogger as _CL
          import kubetee_health_latest  # noqa - patches health_check_latest SQL at import
          assert issubclass(kubetee_health_latest.KubeTEEHealthLatest, _CL)
          assert 'DISTINCT ON (\"model_name\")' in __import__('litellm.proxy.db.health_check_latest', fromlist=['x']).LATEST_HEALTH_CHECKS_SQL
          assert hasattr(kubetee_route_guard, 'kubetee_route_guard_logger')
          assert hasattr(kubetee_attestation, 'kubetee_attestation_logger')
          assert hasattr(kubetee_glm_effort, 'kubetee_glm_effort_logger')
          # Both tee-pubkey arms must work — RSA is the live east-west key.
          from cryptography.hazmat.primitives.asymmetric import ec, rsa
          assert kubetee_ear.tee_pubkey_of(ec.generate_private_key(ec.SECP256R1()))['kty'] == 'EC'
          assert kubetee_ear.tee_pubkey_of(rsa.generate_private_key(public_exponent=65537, key_size=2048))['kty'] == 'RSA'
          assert kubetee_ear.tee_pubkey_from_key_pem(b'not a key') is None
          print('overlay modules import OK against base', '${BASE_TAG}')
          "

      - name: Build and push overlay image (publish only from kubetee-prod)
        run: |
          cd tools/kubetee-litellm-overlay
          if [ "$PUBLISH" = "true" ]; then
            OUTPUT="--push"
          else
            OUTPUT="--load"
          fi
          docker buildx build --platform linux/amd64 \
            --build-arg BASE_TAG=${BASE_TAG} \
            --build-arg BASE_DIGEST=${DEFAULT_BASE_DIGEST} \
            --metadata-file /tmp/kubetee-image-metadata.json \
            -f Dockerfile \
            -t ${REGISTRY}/${IMAGE_NAME}:${TAG} \
            ${OUTPUT} \
            .
          echo "Built ${REGISTRY}/${IMAGE_NAME}:${TAG} (PUBLISH=${PUBLISH})"

      - name: Record and sign immutable digest
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          IMAGE_DIGEST=$(python3 -c 'import json; print(json.load(open("/tmp/kubetee-image-metadata.json"))["containerimage.digest"])')
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          python3 - <<'PY' > /tmp/kubetee-overlay-provenance.json
          import json, os
          print(json.dumps({
              "buildType": "kubetee-litellm-overlay/v1",
              "builder": {"id": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},
              "invocation": {
                  "configSource": {"uri": f"git+{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}@{os.environ['GITHUB_SHA']}"},
                  "entryPoint": ".github/workflows/build-litellm-overlay.yaml",
                  "parameters": {"baseTag": os.environ["BASE_TAG"], "baseDigest": os.environ["DEFAULT_BASE_DIGEST"], "tag": os.environ["TAG"]},
              },
          }))
          PY
          cosign attest --yes --type slsaprovenance --predicate /tmp/kubetee-overlay-provenance.json "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign verify --certificate-identity-regexp 'https://github.com/KubeTEE-AI/litellm/.github/workflows/build-litellm-overlay.yaml.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Resolve local or published scan target
        id: scan-target
        run: |
          if [ "$PUBLISH" = "true" ]; then
            scan_image="${IMAGE_REF}"
          else
            scan_image="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          fi
          echo "image=${scan_image}" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
          cache: false

      - name: Scan release image for actionable high and critical vulnerabilities
        run: |
          if [ "$PUBLISH" = "true" ]; then
            IMAGE_SOURCE="remote"
          else
            IMAGE_SOURCE="docker"
          fi
          trivy image --image-src "${IMAGE_SOURCE}" --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --format json --output /tmp/kubetee-11083-trivy.json \
            --exit-code 1 "${{ steps.scan-target.outputs.image }}"

      - name: Save supply-chain evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litellm-1.108.3-kubetee-release
          path: |
            /tmp/kubetee-image-metadata.json
            /tmp/kubetee-overlay-provenance.json
            /tmp/kubetee-11083-trivy.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify built image and published registry reference
        run: |
          if [ "$PUBLISH" = "true" ]; then
            docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG}
          fi
          # Modules land in the venv site-packages the proxy runs with.
          docker run --rm --entrypoint /app/.venv/bin/python \
            ${REGISTRY}/${IMAGE_NAME}:${TAG} \
            -c "import kubetee_route_guard, kubetee_attestation, kubetee_binding, kubetee_ear, kubetee_eastwest, kubetee_bootstrap, sitecustomize, kubetee_glm_effort, kubetee_mcp_trust, kubetee_health_latest; print('verify: import OK')"
          docker run --rm --entrypoint /app/.venv/bin/python \
            ${REGISTRY}/${IMAGE_NAME}:${TAG} \
            -c "
          from pathlib import Path
          p = Path('/app/.venv/lib/python3.13/site-packages')
          for m in ('kubetee_route_guard.py', 'kubetee_attestation.py', 'kubetee_binding.py', 'kubetee_ear.py', 'kubetee_eastwest.py', 'kubetee_bootstrap.py', 'sitecustomize.py', 'kubetee_glm_effort.py', 'kubetee_mcp_trust.py', 'kubetee_health_latest.py'):
              f = p / m
              assert f.is_file(), f'MISSING {m}'
              print(m, f.stat().st_size, 'bytes')
          "
          echo "image ${REGISTRY}/${IMAGE_NAME}:${TAG} verified"
